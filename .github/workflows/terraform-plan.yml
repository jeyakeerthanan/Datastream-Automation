name: terraform-plan

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # Map keys MUST match YAML passwordSecret values (e.g., medina_sql_pwd, d365_sql_pwd)
      TF_VAR_sql_passwords: >-
        {"medina_sql_pwd":"${{ secrets.MEDINA_SQL_PASSWORD }}","d365_sql_pwd":"${{ secrets.D365_SQL_PASSWORD }}"}

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: |
          terraform init -upgrade=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=datastream/dev"

      - name: Terraform Format Check
        working-directory: terraform/envs/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/envs/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/envs/dev
        run: terraform plan -var-file="dev.tfvars" -no-color
