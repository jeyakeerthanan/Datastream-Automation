name: terraform-apply

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # IMPORTANT:
      # Map keys MUST match the `passwordSecret` values in your source CP YAMLs
      # (e.g., medina_sql_pwd, d365_sql_pwd)
      TF_VAR_sql_passwords: >-
        {"medina_sql_pwd":"${{ secrets.MEDINA_SQL_PASSWORD }}","d365_sql_pwd":"${{ secrets.D365_SQL_PASSWORD }}"}

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: |
          terraform init -upgrade=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=datastream/dev"

      - name: Terraform Format Check
        working-directory: terraform/envs/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/envs/dev
        run: terraform validate

      - name: Terraform Plan (detect real diff)
        id: plan
        working-directory: terraform/envs/dev
        run: |
          set -euo pipefail

          set +e
          terraform plan -detailed-exitcode -var-file="dev.tfvars" -no-color
          code=$?
          set -e

          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          if [[ "$code" -eq 0 ]]; then
            echo "Terraform reports NO changes (0)."
          elif [[ "$code" -eq 2 ]]; then
            echo "Terraform reports CHANGES present (2)."
          else
            echo "Terraform plan failed (exit=$code)."
            exit "$code"
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: terraform/envs/dev
        run: |
          set -euo pipefail
          terraform apply -auto-approve -var-file="dev.tfvars" -no-color

      - name: Skip Apply (no diff)
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No Terraform diff detected. Skipping apply."
